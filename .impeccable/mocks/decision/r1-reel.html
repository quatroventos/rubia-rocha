<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Showreel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:900px;overflow:hidden}
body{background:#08080A;color:#F3F3F1;font-family:"Helvetica Neue",Arial,sans-serif;position:relative}
nav{position:absolute;left:0;right:0;top:0;height:96px;display:flex;align-items:center;padding:0 44px;gap:40px}
.logo{font-weight:700;font-size:26px;letter-spacing:-.03em}
.links{display:flex;gap:36px;font-size:17px;color:#B9B9B6;margin:0 auto}
.pill{background:#F3F3F1;color:#08080A;padding:15px 26px;border-radius:999px;font-weight:600;font-size:16px}
h1{position:absolute;left:40px;top:120px;font-size:124px;line-height:.9;letter-spacing:-.05em;font-weight:700;max-width:1300px}
.reel{position:absolute;left:40px;right:40px;top:400px;height:420px;border-radius:28px;background:linear-gradient(120deg,#1B2A4A,#3B2F5E 45%,#123D3A);overflow:hidden}
.reel .scr{position:absolute;left:180px;top:60px;width:640px;height:400px;border-radius:14px;background:#F2F1EE;transform:rotate(-6deg)}
.reel .scr2{position:absolute;left:760px;top:110px;width:260px;height:520px;border-radius:38px;background:#141418;border:10px solid #2A2A30;transform:rotate(8deg)}
.reel .lbl{position:absolute;left:28px;bottom:24px;font-size:24px;font-weight:600}
.reel .play{position:absolute;right:28px;bottom:22px;background:#F3F3F1;color:#08080A;padding:14px 24px;border-radius:999px;font-weight:600;font-size:16px}
.row{position:absolute;left:44px;right:44px;bottom:28px;display:flex;justify-content:space-between;font-size:16px;color:#B9B9B6}
</style>
</head>
<body>
<nav><div class="logo">Quatro Ventos</div><div class="links"><span>IA</span><span>Software</span><span>Web</span><span>Suporte</span><span>Cases</span><span>Sobre</span></div><div class="pill">Iniciar um projeto</div></nav>
<h1>Processos melhores com inteligência artificial.</h1>
<div class="reel"><div class="scr"></div><div class="scr2"></div><span class="lbl">Cases 2026: Digio, Hemera, Facilitapay</span><span class="play">Assistir</span></div>
</body>
</html>
