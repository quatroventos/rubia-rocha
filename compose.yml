name: rubiarocha

services:
  mysql:
    image: mysql:8.4
    container_name: rubiarocha-mysql
    environment:
      MYSQL_DATABASE: rubiarocha
      MYSQL_USER: rubiarocha
      MYSQL_PASSWORD: rubiarocha
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${DB_FORWARD_PORT:-3308}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-urubiarocha", "-prubiarocha"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: rubiarocha-redis

  mailpit:
    image: axllent/mailpit:latest
    container_name: rubiarocha-mailpit
    ports:
      - "${MAILPIT_FORWARD_PORT:-8027}:8025"

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    image: rubiarocha:local
    container_name: rubiarocha
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:${APP_FORWARD_PORT:-8081}"
      RUN_MIGRATIONS: "true"
      RUN_SEED: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: rubiarocha
      DB_USERNAME: rubiarocha
      DB_PASSWORD: rubiarocha
      REDIS_HOST: redis
      CACHE_STORE: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    ports:
      - "${APP_FORWARD_PORT:-8081}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  queue:
    image: rubiarocha:local
    container_name: rubiarocha-queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    env_file:
      - .env
    environment:
      APP_URL: "http://localhost:${APP_FORWARD_PORT:-8081}"
      RUN_MIGRATIONS: "false"
      RUN_SEED: "false"
      DB_HOST: mysql
      REDIS_HOST: redis
      MAIL_HOST: mailpit
      OG_CAPTURE_URL: "http://rubiarocha:8000"
    entrypoint: ["/bin/sh", "-c", "php artisan queue:work --sleep=1 --tries=3"]
    depends_on:
      - app

  scheduler:
    image: rubiarocha:local
    container_name: rubiarocha-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "false"
      RUN_SEED: "false"
      DB_HOST: mysql
      REDIS_HOST: redis
    entrypoint: ["/bin/sh", "-c", "php artisan schedule:work"]
    depends_on:
      - app

volumes:
  mysql_data:
    name: rubiarocha_mysql_data
  node_modules:
